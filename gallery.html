<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleria — Yani Hartonen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #C8C8C8;
            color: #000000;
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            color: #000000;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Top Bar */
        .topbar {
            background-color: #C8C8C8;
            border-bottom: 2px solid #000000;
            padding: 1.2rem 2rem;
        }

        .topbar-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            font-size: 1.2rem;
        }

        .brand img {
            width: 36px;
            height: 36px;
            display: block;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            font-size: 0.95rem;
        }

        /* Main Gallery Container */
        .gallery-page {
            background-color: #B0B0B0;
            min-height: calc(100vh - 160px);
            padding: 3.5rem 2rem 5rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .page-header {
            margin-bottom: 2.5rem;
        }

        .page-header h1 {
            font-size: 2.4rem;
            font-weight: 400;
            margin-bottom: 0.75rem;
        }

        .page-header h1::before {
            content: "/ ";
        }

        .page-header p {
            font-size: 1rem;
            max-width: 720px;
        }

        /* Filter Buttons */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 2.5rem;
        }

        .filter-btn {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            background-color: #C8C8C8;
            color: #000000;
            border: 2px solid #000000;
            padding: 0.55rem 1.1rem;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background-color: #000000;
            color: #C8C8C8;
        }

        /* Masonry Grid: keeps vertical & horizontal ratios without cropping */
        .masonry-grid {
            column-count: 3;
            column-gap: 1.25rem;
        }

        .gallery-card {
            break-inside: avoid;
            margin-bottom: 1.25rem;
            background-color: #8a8a8a;
            border: 1px solid #000000;
            cursor: pointer;
            transition: opacity 0.25s ease;
        }

        .gallery-card.hidden {
            display: none;
        }

        .gallery-card:hover {
            opacity: 0.9;
        }

        .gallery-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .gallery-caption {
            padding: 0.5rem 0.75rem;
            background-color: #C8C8C8;
            border-top: 1px solid #000000;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
        }

        /* Lightbox Modal */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 92vw;
            max-height: 88vh;
            object-fit: contain;
            box-shadow: 0 0 40px rgba(200, 200, 200, 0.25);
        }

        .lightbox-close {
            position: fixed;
            top: 18px;
            right: 28px;
            font-size: 40px;
            line-height: 1;
            color: #C8C8C8;
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
        }

        .lightbox-close:hover {
            color: #FFFFFF;
        }

        /* Footer */
        footer {
            background-color: #C8C8C8;
            border-top: 2px solid #000000;
            padding: 2.5rem 2rem;
            text-align: center;
        }

        footer p {
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .masonry-grid {
                column-count: 2;
            }
        }

        @media (max-width: 640px) {
            .masonry-grid {
                column-count: 1;
            }

            .page-header h1 {
                font-size: 1.9rem;
            }

            .gallery-page {
                padding: 2.5rem 1rem 4rem;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="index.html">
                <img src="images/Yani Hartonen logo vector greay for site 2026.svg" alt="Yani Hartonen Logo">
                <span>Yani Hartonen</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Etusivu</a>
                <a href="index.html#valokuvaus">Valokuvaus</a>
                <a href="index.html#videografia">Videografia</a>
                <a href="index.html#grafiikka">Grafiikka</a>
                <a href="gallery.html">Galleria</a>
            </nav>
        </div>
    </header>

    <main class="gallery-page">
        <div class="container">
            <div class="page-header">
                <h1>Galleria</h1>
                <p>Valikoituja valokuvia eri aiheista ja projekteista (30 kuvaa). Klikkaa kuvaa avataksesi sen suurempana.</p>
            </div>

            <!-- Кнопки тем: меняй текст внутри кнопок под свои категории -->
            <div class="filters" role="tablist" aria-label="Kuvien aiheet">
                <button class="filter-btn active" data-filter="all" type="button">Kaikki (30)</button>
                <button class="filter-btn" data-filter="aihe1" type="button">Aihe 1 (1–10)</button>
                <button class="filter-btn" data-filter="aihe2" type="button">Aihe 2 (11–20)</button>
                <button class="filter-btn" data-filter="aihe3" type="button">Aihe 3 (21–30)</button>
            </div>

            <!-- Сетка заполняется автоматически для photo-01.jpg ... photo-30.jpg -->
            <div class="masonry-grid" id="galleryGrid"></div>
        </div>
    </main>

    <footer>
        <p>© 2026 Yani Hartonen. Kaikki oikeudet pidätetään.</p>
    </footer>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox" aria-hidden="true">
        <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Sulje">×</button>
        <img id="lightboxImg" src="" alt="Full size photo">
    </div>

    <script>
        // Настройки 30 фотографий:
        // Файлы должны лежать в папке: images/gallery/photo-01.jpg ... photo-30.jpg
        // Поменяй названия тем в topicLabel под себя (например: "Muoti", "Kauneus", "Mainonta")
        const totalPhotos = 30;
        const folderPath = "images/gallery/";

        function getCategoryByIndex(index) {
            if (index <= 10) return { key: "aihe1", label: "Aihe 1" };
            if (index <= 20) return { key: "aihe2", label: "Aihe 2" };
            return { key: "aihe3", label: "Aihe 3" };
        }

        const grid = document.getElementById("galleryGrid");

        for (let i = 1; i <= totalPhotos; i++) {
            const num = String(i).padStart(2, "0"); // 01, 02 ... 30
            const fileName = `photo-${num}.jpg`;
            const filePath = `${folderPath}${fileName}`;
            const cat = getCategoryByIndex(i);

            const card = document.createElement("article");
            card.className = "gallery-card";
            card.dataset.category = cat.key;
            card.onclick = () => openLightbox(filePath, `Kuva ${num}`);

            const img = document.createElement("img");
            img.src = filePath;
            img.alt = `Photo ${num} - ${cat.label}`;
            img.loading = "lazy";

            const caption = document.createElement("div");
            caption.className = "gallery-caption";
            caption.innerHTML = `<span>#${num}</span><span>${cat.label}</span>`;

            card.appendChild(img);
            card.appendChild(caption);
            grid.appendChild(card);
        }

        // Фильтрация по темам
        const filterButtons = document.querySelectorAll(".filter-btn");
        const cards = document.querySelectorAll(".gallery-card");

        filterButtons.forEach((btn) => {
            btn.addEventListener("click", () => {
                filterButtons.forEach((b) => b.classList.remove("active"));
                btn.classList.add("active");

                const filter = btn.dataset.filter;
                cards.forEach((card) => {
                    if (filter === "all" || card.dataset.category === filter) {
                        card.classList.remove("hidden");
                    } else {
                        card.classList.add("hidden");
                    }
                });
            });
        });

        // Lightbox
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightboxImg");
        const lightboxClose = document.getElementById("lightboxClose");

        function openLightbox(src, altText) {
            lightboxImg.src = src;
            lightboxImg.alt = altText;
            lightbox.classList.add("active");
            lightbox.setAttribute("aria-hidden", "false");
        }

        function closeLightbox() {
            lightbox.classList.remove("active");
            lightbox.setAttribute("aria-hidden", "true");
            lightboxImg.src = "";
        }

        lightboxClose.addEventListener("click", closeLightbox);
        lightbox.addEventListener("click", (e) => {
            if (e.target === lightbox) closeLightbox();
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeLightbox();
        });
    </script>
</body>
</html>
